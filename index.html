<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerenciador de Rotas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="top-bar">
    <span>Mapa</span>
    <button id="btnToggleMap">🛰</button>
  </header>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- BOTÕES FLUTUANTES -->
  <button id="btnLocate" class="fab left">📍</button>
  <button id="btnDefine" class="fab right">📌</button>

  <!-- AÇÕES -->
  <div class="action-bar">
    <button id="btnStartRoute">▶ Iniciar</button>
    <button id="btnAddStop">➕ Parada</button>
    <button id="btnRemoveStop">➖ Parada</button>
    <button id="btnSaveRoute">💾 Salvar</button>
    <button id="btnNewRoute">🆕 Nova</button>
  </div>

  <!-- BARRA INFERIOR -->
  <nav class="bottom-bar">
    <button class="active">🗺<span>Mapa</span></button>
    <button>📂<span>Rotas</span></button>
  </nav>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
