<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Rotas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ABA MAPA -->
<div id="tabMap" class="tab active">
  <div id="map"></div>

  <div class="top-bar">
    <span>Mapa</span>
    <button id="btnSatellite">🛰</button>
  </div>

  <button id="btnLocate" class="fab left">📍</button>
  <button id="btnAddStop" class="fab right">➕</button>

  <button id="btnMain" class="main-btn">▶ Iniciar rota</button>
</div>

<!-- ABA ROTAS -->
<div id="tabRoutes" class="tab">
  <div class="routes">
    <h2>Rotas</h2>
    <ul id="routesList"></ul>
  </div>
</div>

<!-- TAB BAR -->
<div class="tab-bar">
  <button id="goMap" class="active">Mapa</button>
  <button id="goRoutes">Rotas</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
