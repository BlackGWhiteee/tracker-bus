<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Rotas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- MAPA -->
  <div id="map"></div>

  <!-- BOTÕES -->
  <div class="controls">
    <button id="btnLocate">Minha posição</button>
    <button id="btnDefine">Definir localização</button>
    <button id="btnToggleMap">Satélite</button>
    <button id="btnAddStop">Adicionar parada</button>
    <button id="btnRemoveStop">Remover parada</button>
    <button id="btnStartRoute">Iniciar rota</button>
    <button id="btnSaveRoute">Salvar rota</button>
    <button id="btnNewRoute">Nova rota</button>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
