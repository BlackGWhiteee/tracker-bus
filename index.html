<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Gerenciador de Rotas</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6a1b9a" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- MAPA -->
  <div id="map"></div>

  <!-- PAINEL -->
  <div class="panel">
    <input type="text" id="routeName" placeholder="Nome da rota" />
    <button id="add">Adicionar parada</button>
    <button id="remove" class="danger">Remover parada</button>
    <button id="gps">Minha posição</button>
    <button id="manual">Definir localização</button>
    <button id="save">Salvar rota</button>
    <button id="new">Nova rota</button>
  </div>

  <!-- SCRIPTS (ORDEM OBRIGATÓRIA) -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

  <!-- SERVICE WORKER -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("service-worker.js");
    }
  </script>

</body>
</html>
