<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Gerenciador de Rotas</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6a1b9a">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <!-- Ícones -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- MAPA -->
<div id="map"></div>

<!-- CONTROLES -->
<div class="controls">
  <input id="routeName" placeholder="Nome da rota">

  <button id="start">
    <span class="material-symbols-outlined">play_arrow</span>
    Iniciar
  </button>

  <button id="addStop" disabled>
    <span class="material-symbols-outlined">add_location</span>
    Parada
  </button>

  <button id="finish" disabled>
    <span class="material-symbols-outlined">stop</span>
    Encerrar
  </button>

  <button id="locate">
    <span class="material-symbols-outlined">my_location</span>
    Minha posição
  </button>

  <button id="manual">
    <span class="material-symbols-outlined">edit_location</span>
    Definir localização
  </button>
</div>

<!-- BOTÃO SATÉLITE -->
<button id="toggleLayer" class="fab" title="Mapa / Satélite">
  <span class="material-symbols-outlined">satellite_alt</span>
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
